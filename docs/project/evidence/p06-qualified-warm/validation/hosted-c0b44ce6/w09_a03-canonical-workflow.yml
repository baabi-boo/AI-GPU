      - 'sim/simx/**'
      - 'docs/project/**'
      - 'docs/designs/tiny_mlp_fixture_v1.md'
      - 'docs/designs/mlp_execution_records_v1.md'
      - 'docs/designs/tensor_numerics_v1.md'
      - 'docs/designs/python_binding_v1.md'
      - 'docs/designs/torch_custom_ops_v1.md'
      - 'docs/designs/native_benchmark_v1.md'
      - 'docs/designs/native_baseline_analysis_v1.md'
      - 'docs/designs/serial_matmul_workspace_v1.md'
      - 'docs/designs/warm_workspace_benchmark_v1.md'
      - 'docs/designs/managed_counter_preflight_v1.md'
      - 'docs/designs/managed_counter_lifetime_v1.md'
      - 'docs/designs/complete_counter_qualification_v1.md'
      - 'docs/designs/qualified_warm_workspace_v1.md'
      - 'docs/designs/dependency_provenance_v1.md'
      - 'docs/designs/managed_counter_preflight_replay_v1.md'
