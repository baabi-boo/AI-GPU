name: P06 Serial Workspace

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/p06-workspace.yml'
      - 'ci/project/**'
      - 'ci/toolchain_rev.sh'
      - 'ci/install_dependencies.sh'
      - 'ci/gen_config.py'
      - 'configure'
      - 'Makefile.in'
      - 'ci/blackbox.sh'
      - 'config.mk.in'
      - 'sw/**'
      - 'sim/**'
      - 'hw/rtl/**'
      - 'hw/dpi/**'
      - 'tests/regression/ai_workspace/**'
      - 'tests/regression/ai_matmul/**'
      - 'tests/regression/sgemm_tcu/**'
      - 'tests/runtime/**'
      - 'tests/regression/common.mk'
      - 'third_party/**'
      - 'profiles/p02-tfr.json'
      - 'docs/designs/serial_matmul_workspace_v1.md'
      - 'docs/designs/ai_operator_contract_v1.md'
      - 'docs/designs/tensor_numerics_v1.md'
      - 'VERSION'
      - 'VX_config.toml'
      - 'VX_types.toml'
      - '.gitmodules'
  pull_request:
    paths:
      - '.github/workflows/p06-workspace.yml'
      - 'ci/project/**'
      - 'ci/toolchain_rev.sh'
      - 'ci/install_dependencies.sh'
      - 'ci/gen_config.py'
      - 'configure'
      - 'Makefile.in'
      - 'ci/blackbox.sh'
      - 'config.mk.in'
      - 'sw/**'
      - 'sim/**'
      - 'hw/rtl/**'
      - 'hw/dpi/**'
      - 'tests/regression/ai_workspace/**'
      - 'tests/regression/ai_matmul/**'
      - 'tests/regression/sgemm_tcu/**'
      - 'tests/runtime/**'
      - 'tests/regression/common.mk'
      - 'third_party/**'
      - 'profiles/p02-tfr.json'
      - 'docs/designs/serial_matmul_workspace_v1.md'
      - 'docs/designs/ai_operator_contract_v1.md'
      - 'docs/designs/tensor_numerics_v1.md'
      - 'VERSION'
      - 'VX_config.toml'
      - 'VX_types.toml'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-workspace-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Workspace correctness (${{ matrix.backend }}, ${{ matrix.format }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        backend: [simx, rtlsim]
        format: [fp16, bf16]
    env:
      P06_WORKSPACE_BACKEND: ${{ matrix.backend }}
      P06_WORKSPACE_FORMAT: ${{ matrix.format }}
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: '-j2'
      THREADS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CCACHE_DISABLE: '1'
      OBJCACHE: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Initialize retained job identity
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'p06-workspace'
          root.mkdir(mode=0o700)
          (root / 'evidence').mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('P06_WORKSPACE_ROOT=' + str(root) + '\n')
          workflow = Path('.github/workflows/p06-workspace.yml').read_bytes()
          (root / 'evidence' / 'workflow.yml').write_bytes(workflow)
          data = {key: os.environ[key] for key in (
              'GITHUB_SHA', 'GITHUB_EVENT_NAME', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT',
              'GITHUB_JOB', 'GITHUB_REPOSITORY', 'GITHUB_REF',
              'P06_WORKSPACE_BACKEND', 'P06_WORKSPACE_FORMAT')}
          data.update(scope='native-serial-workspace-correctness',
                      native_execution='not_run', acceptance_claimed=False,
                      workflow_sha256=hashlib.sha256(workflow).hexdigest())
          (root / 'evidence' / 'job.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Provision pinned CPython
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          architecture: x64
          check-latest: false
      - name: Retain and verify Python interpreter identity
        run: |
          python3 -I - <<'PY'
          import json, os, platform, shutil, sys
          from pathlib import Path
          data = {'python_version': list(sys.version_info[:3]),
                  'implementation': platform.python_implementation(),
                  'platform': sys.platform, 'executable': sys.executable,
                  'python3_on_path': shutil.which('python3')}
          target = Path(os.environ['P06_WORKSPACE_ROOT']) / 'evidence' / 'python-provision.json'
          target.write_text(json.dumps(data, indent=2) + '\n')
          if (data['python_version'] != [3, 12, 14] or data['implementation'] != 'CPython'
                  or data['platform'] != 'linux'
                  or Path(data['python3_on_path']).resolve() != Path(sys.executable).resolve()):
              raise SystemExit('Python interpreter identity differs from the pinned inputs')
          PY
      - name: Resolve pinned toolchain cache identity
        id: pins
        run: |
          set -euo pipefail
          P06_WORKSPACE_TOOLCHAIN_ID=$(bash ci/toolchain_rev.sh)
          [[ "$P06_WORKSPACE_TOOLCHAIN_ID" =~ ^[A-Za-z0-9._-]+-[0-9a-f]{40}$ ]]
          echo "toolchain=$P06_WORKSPACE_TOOLCHAIN_ID" >> "$GITHUB_OUTPUT"
      - name: Restore pinned toolchain without writing cache
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: tools
          key: ${{ runner.os }}-toolchain-${{ steps.pins.outputs.toolchain }}-lite
          restore-keys: ${{ runner.os }}-toolchain-${{ steps.pins.outputs.toolchain }}-
      - name: Restore dependency inputs without writing cache
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('third_party/Makefile', '.gitmodules') }}
      - name: Install baseline host dependencies
        if: steps.toolchain.outputs.cache-matched-key != '' && steps.dependencies.outputs.cache-matched-key != ''
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo bash ci/install_dependencies.sh \
            2>&1 | tee "$P06_WORKSPACE_ROOT/evidence/host-dependencies.log"
      - name: Verify clean source and relocate restored tools
        env:
          P06_WORKSPACE_TOOLCHAIN_ID: ${{ steps.pins.outputs.toolchain }}
          P06_WORKSPACE_TOOLCHAIN_CACHE: ${{ steps.toolchain.outputs.cache-matched-key }}
          P06_WORKSPACE_DEPENDENCY_CACHE: ${{ steps.dependencies.outputs.cache-matched-key }}
          P06_WORKSPACE_DEPENDENCY_KEY: ${{ runner.os }}-thirdparty-${{ hashFiles('third_party/Makefile', '.gitmodules') }}
        run: |
          set -euo pipefail
          python3 ci/project/p04_ci_prepare.py \
            --source-dir "$PWD" --workspace-dir "$P06_WORKSPACE_ROOT" \
            --expected-revision "$GITHUB_SHA" --toolchain-id "$P06_WORKSPACE_TOOLCHAIN_ID" \
            --toolchain-cache-key "$P06_WORKSPACE_TOOLCHAIN_CACHE" \
            --third-party-cache-key "$P06_WORKSPACE_DEPENDENCY_CACHE" \
            --expected-third-party-key "$P06_WORKSPACE_DEPENDENCY_KEY" \
            --backend "$P06_WORKSPACE_BACKEND" --format "$P06_WORKSPACE_FORMAT" \
            2>&1 | tee "$P06_WORKSPACE_ROOT/evidence/preparation.log"
      - name: Execute frozen workspace correctness variant
        run: |
          python3 ci/project/p06_workspace_execute.py run \
            --source-dir "$PWD" --tools-dir "$P06_WORKSPACE_ROOT/tools" \
            --work-dir "$P06_WORKSPACE_ROOT/work" --output "$P06_WORKSPACE_ROOT/evidence/workspace" \
            --backend "$P06_WORKSPACE_BACKEND" --format "$P06_WORKSPACE_FORMAT" \
            --jobs 2 --timeout-seconds 1800 --run-timeout-seconds 180
      - name: Retain preparation and native execution packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p06-workspace-${{ matrix.backend }}-${{ matrix.format }}-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/p06-workspace/evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
