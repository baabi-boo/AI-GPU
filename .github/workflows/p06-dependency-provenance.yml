      - 'ci/toolchain_rev.sh'
      - 'ci/install_dependencies.sh'
      - 'ci/blackbox.sh'
      - 'ci/gen_config.py'
      - 'configure'
      - 'Makefile.in'
      - 'config.mk.in'
      - 'sim/**'
      - 'sw/**'
      - 'hw/**'
      - 'tests/regression/ai_counter_preflight/**'
      - 'tests/unittest/pending_reads/**'
      - 'tests/regression/ai_warm_workspace/**'
      - 'tests/regression/ai_workspace/**'
      - 'tests/regression/ai_bench_common/**'
      - 'tests/regression/ai_matmul/**'
      - 'tests/regression/sgemm_tcu/**'
      - 'tests/regression/common.mk'
      - 'tests/runtime/**'
