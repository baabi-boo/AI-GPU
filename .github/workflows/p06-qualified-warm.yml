name: P06 Qualified Warm

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p06-qualified-warm-master
  cancel-in-progress: false

jobs:
  qualified-warm:
    name: Qualified warm hosted
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'baabi-boo/AI-GPU' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # Provisioning and encrypted closeout surround the unchanged 90-minute native budget.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAKEFLAGS: '-j2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      THREADS: '1'
      CCACHE_DISABLE: '1'
      OBJCACHE: ''
    steps:
      - name: Require private delivery configuration
        env:
          P06_CONTROL_ARCHIVE_URL: ${{ secrets.P06_CONTROL_ARCHIVE_URL }}
          P06_EVIDENCE_AGE_RECIPIENT: ${{ vars.P06_EVIDENCE_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          if [[ -z "${P06_CONTROL_ARCHIVE_URL:-}" || -z "${P06_EVIDENCE_AGE_RECIPIENT:-}" ]]; then
            echo 'Private control delivery and an explicit public age recipient are required.'
            exit 1
          fi
      - name: Check out exact trusted source
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: recursive
          lfs: false
          persist-credentials: false
      - name: Require exact revision full governance success
        id: preflight
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B ci/project/p06_qualified_warm_hosted.py preflight \
            --source-dir "$GITHUB_WORKSPACE" --expected-revision "$GITHUB_SHA" \
            2> "$RUNNER_TEMP/p06-hosted-preflight.PRIVATE.log"
      - name: Provision pinned CPython
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          architecture: x64
          check-latest: false
      - name: Compose private qualified warm attempt and encrypted closeout
        id: hosted
        # Ordinary failures still receive closeout; cancellation must not start new work.
        if: ${{ always() && !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P06_CONTROL_ARCHIVE_URL: ${{ secrets.P06_CONTROL_ARCHIVE_URL }}
          P06_EVIDENCE_AGE_RECIPIENT: ${{ vars.P06_EVIDENCE_AGE_RECIPIENT }}
          P06_HOST_SETUP_READY: ${{ steps.preflight.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B ci/project/p06_qualified_warm_hosted.py run \
            --source-dir "$GITHUB_WORKSPACE" --expected-revision "$GITHUB_SHA" \
            --attempt-root "$RUNNER_TEMP/p06-qualified-warm-attempt" \
            2> "$RUNNER_TEMP/p06-hosted-entry.PRIVATE.log"
      - name: Retain encrypted qualified warm attempt
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.hosted.outputs.encrypted_retention_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p06-qualified-warm-encrypted-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p06-qualified-warm-attempt/public/qualified-warm-retention.tar.age
            ${{ runner.temp }}/p06-qualified-warm-attempt/public/encryption-summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
