name: P06 Frozen Baseline Replay

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/p06-baseline.yml'
      - '.github/workflows/p04-model.yml'
      - 'docs/project/evidence/p06-baseline/**'
      - 'docs/project/evidence/p05-torch/reviews/archive_reader.py'
      - 'ci/project/**'
      - 'ci/toolchain_rev.sh'
      - 'ci/install_dependencies.sh'
      - 'ci/gen_config.py'
      - 'ci/blackbox.sh'
      - 'configure'
      - 'Makefile.in'
      - 'config.mk.in'
      - '*.toml'
      - 'sw/**'
      - 'sim/**'
      - 'hw/**'
      - 'tests/regression/ai_bench_common/**'
      - 'tests/regression/ai_bench_matmul/**'
      - 'tests/regression/ai_bench_mlp/**'
      - 'tests/regression/ai_matmul/**'
      - 'tests/regression/ai_mlp/**'
      - 'tests/regression/sgemm_tcu/**'
      - 'tests/regression/common.mk'
      - 'tests/runtime/**'
      - 'third_party/**'
      - 'profiles/**'
      - 'docs/designs/native_benchmark_v1.md'
      - 'docs/designs/tiny_mlp_fixture_v1.md'
      - 'docs/designs/mlp_execution_records_v1.md'
      - 'docs/designs/tensor_numerics_v1.md'
      - 'VERSION'
      - 'LICENSE'
      - 'VX_config.toml'
      - 'VX_types.toml'
      - '.gitmodules'
  pull_request:
    paths:
      - '.github/workflows/p06-baseline.yml'
      - '.github/workflows/p04-model.yml'
      - 'docs/project/evidence/p06-baseline/**'
      - 'docs/project/evidence/p05-torch/reviews/archive_reader.py'
      - 'ci/project/**'
      - 'ci/toolchain_rev.sh'
      - 'ci/install_dependencies.sh'
      - 'ci/gen_config.py'
      - 'ci/blackbox.sh'
      - 'configure'
      - 'Makefile.in'
      - 'config.mk.in'
      - '*.toml'
      - 'sw/**'
      - 'sim/**'
      - 'hw/**'
      - 'tests/regression/ai_bench_common/**'
      - 'tests/regression/ai_bench_matmul/**'
      - 'tests/regression/ai_bench_mlp/**'
      - 'tests/regression/ai_matmul/**'
      - 'tests/regression/ai_mlp/**'
      - 'tests/regression/sgemm_tcu/**'
      - 'tests/regression/common.mk'
      - 'tests/runtime/**'
      - 'third_party/**'
      - 'profiles/**'
      - 'docs/designs/native_benchmark_v1.md'
      - 'docs/designs/tiny_mlp_fixture_v1.md'
      - 'docs/designs/mlp_execution_records_v1.md'
      - 'docs/designs/tensor_numerics_v1.md'
      - 'VERSION'
      - 'LICENSE'
      - 'VX_config.toml'
      - 'VX_types.toml'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-baseline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: Verify accepted cold baseline as retained data
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize retained replay identity
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'p06-baseline-replay'
          root.mkdir(mode=0o700)
          (root / 'evidence').mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('P06_REPLAY_ROOT=' + str(root) + '\n')
          workflow = Path('.github/workflows/p06-baseline.yml').read_bytes()
          (root / 'evidence' / 'workflow.yml').write_bytes(workflow)
          data = {key: os.environ[key] for key in (
              'GITHUB_SHA', 'GITHUB_EVENT_NAME', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT',
              'GITHUB_JOB', 'GITHUB_REPOSITORY', 'GITHUB_REF')}
          data.update(scope='p06-frozen-baseline-replay', native_execution='not_run',
                      baseline_source_revision='84b6ca0ca75fba248ba330642bbf8764db3d459c',
                      acceptance_claimed=False,
                      workflow_sha256=hashlib.sha256(workflow).hexdigest())
          (root / 'evidence' / 'job.json').write_text(json.dumps(data, indent=2) + '\n')
          PYTHON
      - name: Provision pinned CPython
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          architecture: x64
          check-latest: false
      - name: Retain and verify Python interpreter identity
        run: |
          python3 -I - <<'PYTHON'
          import json, os, platform, shutil, sys
          from pathlib import Path
          data = {'python_version': list(sys.version_info[:3]),
                  'implementation': platform.python_implementation(),
                  'platform': sys.platform, 'executable': sys.executable,
                  'python3_on_path': shutil.which('python3')}
          target = Path(os.environ['P06_REPLAY_ROOT']) / 'evidence' / 'python-provision.json'
          target.write_text(json.dumps(data, indent=2) + '\n')
          if (data['python_version'] != [3, 12, 14] or data['implementation'] != 'CPython'
                  or data['platform'] != 'linux'
                  or Path(data['python3_on_path']).resolve() != Path(sys.executable).resolve()):
              raise SystemExit('Python interpreter identity differs from the pinned inputs')
          PYTHON
      - name: Replay both original digest-pinned archives
        run: |
          set -euo pipefail
          python3 ci/project/p06_analyze.py \
            --fp16-archive "$PWD/docs/project/evidence/p06-baseline/archives/simx-fp16.zip" \
            --fp16-sha256 aaf54ff60b8f4f889264fb3efa4249cbdb02a7fad2b20124b4ad0ba9ae2f41dc \
            --bf16-archive "$PWD/docs/project/evidence/p06-baseline/archives/simx-bf16.zip" \
            --bf16-sha256 f19f174879e2c1fb120a3328ec919d42b4d67f59ba056ceb6e0b6f5607f4996b \
            --source-revision 84b6ca0ca75fba248ba330642bbf8764db3d459c \
            --output "$P06_REPLAY_ROOT/evidence/analysis.json" \
            2>&1 | tee "$P06_REPLAY_ROOT/evidence/replay.log"
      - name: Retain complete replay packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p06-baseline-replay-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/p06-baseline-replay/evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
