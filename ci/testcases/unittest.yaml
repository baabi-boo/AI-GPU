# Unit tests (host). Native catalog entries — replaces the legacy
# regression.sh --unittest delegation (sw + hw unit tests).
category: unittest
defaults:
  xlen: [32, 64]
  tier: smoke
tests:
  - id: sw
    via: script
    run: "make -C tests/unittest run"
  - id: hw
    via: script
    run: "make -C hw/unittest"
  # The ordinary catalog retains cached tools/build context, so these four
  # selected-width executions are nonqualifying development regressions.
  # The dedicated workflow supplies clean-source, full-matrix evidence.
  - id: hw-mpm-transport
    via: script
    xlen: [32, 64]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MAKEFLAGS: "-j2"
      THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CCACHE_DISABLE: "1"
      OBJCACHE: ""
      PROFILE: ""
    run: |
      python3 - <<'PY_MPM'
      import json, os, re, sys, tempfile
      from pathlib import Path
      config = Path('config.mk')
      if config.is_symlink() or not config.is_file():
          raise SystemExit('MPM catalog requires a regular configured config.mk')
      with config.open('rb') as stream:
          data = stream.read(1024 * 1024 + 1)
      if len(data) > 1024 * 1024:
          raise SystemExit('MPM catalog config.mk exceeds its byte bound')
      settings = dict()
      for name in ('VORTEX_HOME', 'TOOLDIR', 'XLEN'):
          values = re.findall(r'^' + name + r'[ \t]*(\?=|:=|=)[ \t]*(.*?)[ \t]*$',
                              data.decode('utf-8'), re.MULTILINE)
          if len(values) != 1 or values[0][0] != '?=':
              raise SystemExit('MPM catalog requires one literal setting for ' + name)
          settings[name] = values[0][1]
      if settings['XLEN'] != '{xlen}':
          raise SystemExit('MPM catalog XLEN differs from the configured tree')
      paths = dict()
      for name in ('VORTEX_HOME', 'TOOLDIR'):
          value = settings[name]
          if not re.fullmatch(r'/[A-Za-z0-9_./+-]+', value):
              raise SystemExit('MPM catalog requires an absolute literal ' + name)
          path = Path(value)
          if path.resolve(strict=True) != path or not path.is_dir():
              raise SystemExit('MPM catalog directory must not traverse a symlink: ' + name)
          paths[name] = path
      source, tools = paths['VORTEX_HOME'], paths['TOOLDIR']
      runner = source / 'ci/project/p06_mpm_execute.py'
      if runner.is_symlink() or not runner.is_file():
          raise SystemExit('MPM catalog source runner is unavailable')
      root = Path(tempfile.mkdtemp(prefix='p06-mpm-catalog-', dir=source.parent))
      work, output = root / 'work', root / 'evidence'
      print(json.dumps(dict(scope='native-host-mpm-transport-regression',
                            xlen=int(settings['XLEN']), packet=str(output))), flush=True)
      os.execv(sys.executable, [sys.executable, str(runner),
                               '--source-dir', str(source), '--tools-dir', str(tools),
                               '--work-dir', str(work), '--output', str(output),
                               '--xlen', settings['XLEN'], '--engines', 'both',
                               '--development'])
      PY_MPM
    touches:
      - ci/testcases/unittest.yaml
      - ci/project/
      - hw/unittest/Makefile
      - hw/unittest/common.mk
      - hw/unittest/verilator.vlt
      - hw/unittest/common/
      - hw/unittest/mpm_transport/
      - hw/rtl/
      - hw/dpi/
      - sim/simx/
      - sim/common/
      - sim/common.mk
      - tests/unittest/mpm_transport/
      - sw/common/
      - sw/include/
      - sw/runtime/
      - third_party/
      - configure
      - config.mk.in
      - ci/gen_config.py
      - docs/designs/host_mpm_transport_v1.md
      - .gitmodules
      - VERSION
      - VX_config.toml
      - VX_types.toml
      - vortex_opae.toml
  # FPU arithmetic units (VX_fma/fdiv/fsqrt/fcvt/fdivsqrt): the `hw` lane above only
  # builds the unit tests; this lane executes them so a softfloat-divergent
  # regression actually fails CI (each driver checks bit-exact result+fflags over
  # millions of vectors across all RISC-V rounding modes, default + lean configs).
  - id: hw-fpu
    via: script
    run: "make -C hw/unittest run-fpu"
  # TCU FEDP datapath: the `hw` lane only builds it; this lane executes tcu_fedp
  # per format (native TFR + DPI). touches gates it on tcu changes.
  - id: hw-tcu
    via: script
    run: "make -C hw/unittest run-tcu"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp, sw/common/fedp.h]
  # VX_tcu_unit end to end (dispatch, uops, operand routing, commit), bit-exact
  # against each datapath's reference: native TFR against the TfrFedp reference
  # model, DPI against its discrete mul/add. Then the native FEDP's
  # fp8 and block-scaled (MX/NVFP4) formats against the same model. The `hw`
  # lane only builds these.
  - id: hw-tcu-unit
    via: script
    run: "make -C hw/unittest run-tcu-unit"
    touches: [hw/rtl/tcu, hw/dpi, hw/unittest/tcu_unit, hw/unittest/tcu_fedp, sw/common/fedp.h]
  # Same native-TFR formats with the multipliers mapped onto DSP48 (USE_DSP=1) —
  # the FPGA-synthesis path, off by default in sim. Bit-identical to LUT by
  # contract, so a mismatch is a DSP-packing bug.
  - id: hw-tcu-dsp
    via: script
    run: "make -C hw/unittest run-tcu-dsp"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp, sw/common/fedp.h]
  # The command processor's DMA port into the last-level cache: a launch behind
  # DMA writes must wait for them to reach the cache. No runtime path launches
  # right behind a DMA write, so no system test observes this ordering.
  - id: hw-cp-llc-port
    via: script
    run: "make -C hw/unittest/cp_llc_port run"
    touches: [hw/rtl/mem/VX_cp_llc_port.sv, hw/unittest/cp_llc_port]
  # Stream arbiters over more than 1.5x MAX_FANOUT requests become trees of
  # slices; a last slice narrower than the arbiter's other side must keep every
  # request on its own output and select. The system shapes reach only a few of
  # these slice shapes.
  - id: hw-stream-arb
    via: script
    run: "make -C hw/unittest/stream_arb run"
    touches: [hw/rtl/libs/VX_stream_arb.sv, hw/unittest/stream_arb]
  # The ID-routed AXI arbiter shared by the AFU and the command processor:
  # write data must reach the slave in address order whichever channel a
  # master offers first, and a slave that takes data before the address must
  # not deadlock it. xrtsim's always-ready slave exercises neither.
  - id: hw-mm-axi-arb
    via: script
    run: "make -C hw/unittest/mm_axi_arb run"
    touches: [hw/rtl/libs/VX_mm_axi_arb.sv, hw/unittest/mm_axi_arb]
  # Texel blend (VX_tex_lerp, both forms the sampler uses) against the C model
  # the SW sampler and SimX share, and the exact Vulkan f/256 blend, over every
  # input.
  - id: hw-tex-lerp
    via: script
    run: "make -C hw/unittest/tex_lerp run"
    touches: [hw/rtl/tex, hw/unittest/tex_lerp, sw/common/vx_gfx_abi.h, sw/common/gfx_frag_tex.h]
  # MUFU datapath (VX_mufu_pe) against the golden model SimX and the tests share
  # (sw/common/mufu.cpp): specials, a strided sweep of all FP32 inputs, random.
  - id: hw-mufu
    via: script
    run: "make -C hw/unittest/mufu_unit run"
    touches: [hw/rtl/mufu, hw/unittest/mufu_unit, sw/common/mufu.cpp, sw/common/mufu_tables.h]
  # Directed four-slot WGMMA protocols; this entry has no processor-model parity claim.
  - id: "hw-tcu-wgmma"
    via: "script"
    driver: "rtlsim"
    xlen: [64]
    configs: "-DVX_CFG_XLEN=64 -DVX_CFG_NUM_CLUSTERS=1 -DVX_CFG_NUM_CORES=1 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_FETCH_WIDTH=2 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_NUM_TCU_BLOCKS=4 -DVX_CFG_NUM_TCU_LANES=8 -DVX_CFG_TCU_PE_RATIO=1 -DVX_CFG_TCU_LATENCY=4 -DVX_CFG_TCU_USE_DSP=0 -DVX_CFG_LMEM_LOG_SIZE=14 -DVX_CFG_LMEM_NUM_BANKS=8 -DVX_CFG_XLEN_64=1 -DVX_CFG_TCU_TYPE=TFR -DVX_CFG_FPU_TYPE=STD -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_LMEM_ENABLE -DVX_CFG_TCU_FP16_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_TF32_DISABLE -DVX_CFG_TCU_FP8_DISABLE -DVX_CFG_TCU_FP4_DISABLE -DVX_CFG_TCU_INT8_DISABLE -DVX_CFG_TCU_INT4_DISABLE -DVX_CFG_TCU_MX_DISABLE -DVX_CFG_TCU_MXFP4_DISABLE -DVX_CFG_TCU_NVFP4_DISABLE -DVX_CFG_TCU_DSM_DISABLE -DVX_CFG_EXT_LDST_MATRIX_DISABLE -DVX_CFG_TCU_SPARSE_ENABLE"
    run: "timeout --signal=TERM --kill-after=15s 1800s make -j2 -C hw/unittest/tcu_wgmma THREADS=2 run"
    env: {"MAKEFLAGS": "-j2", "THREADS": "2", "CMAKE_BUILD_PARALLEL_LEVEL": "2", "CCACHE_DISABLE": "1", "OBJCACHE": "", "PROFILE": ""}
    touches: ["ci/testcases/unittest.yaml", "hw/unittest/tcu_wgmma/", "hw/unittest/common.mk", "hw/unittest/verilator.vlt", "hw/rtl/tcu/", "hw/rtl/interfaces/VX_tcu", "hw/rtl/VX_gpu_pkg.sv", "hw/rtl/VX_define.vh", "VX_config.toml", "VX_types.toml"]
