# SPDX-License-Identifier: Apache-2.0
# Exact functional smoke; the separate bounded matrix owns parity and witness qualification.
category: p02_wgmma
defaults:
  xlen:
  - 64
  tier: smoke
  touches:
  - ci/testcases/p02_wgmma.yaml
  - ci/project/p02_wgmma_matrix.json
  - ci/project/p02_wgmma_fixture_oracle.py
  - ci/project/fixtures/p02_wgmma_v1.json
  - tests/regression/p02_wgmma/
  - tests/regression/sgemm_tcu_wg/
  - tests/regression/sgemm_tcu_wg_sp/
  - tests/regression/common.mk
  - sw/kernel/include/vx_tensor.h
  - sw/runtime/
  - sim/simx/
  - sim/rtlsim/
  - hw/rtl/tcu/
  - hw/rtl/core/
  - hw/rtl/VX_gpu_pkg.sv
  - VX_config.toml
tests:
- id: dense-fp16-ss
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: p02_wgmma
  args: --case=fp16-dense-signatures-a --iterations=2
  flags: --profile= --perf=11
  env:
    MAKEFLAGS: -j2
    THREADS: '2'
    CMAKE_BUILD_PARALLEL_LEVEL: '2'
    CCACHE_DISABLE: '1'
    OBJCACHE: ''
    PROFILE: ''
  configs: -DVX_CFG_XLEN=64 -DVX_CFG_NUM_CLUSTERS=1 -DVX_CFG_NUM_CORES=1 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_FETCH_WIDTH=2 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_NUM_TCU_BLOCKS=4 -DVX_CFG_NUM_TCU_LANES=8 -DVX_CFG_TCU_PE_RATIO=1 -DVX_CFG_TCU_LATENCY=4 -DVX_CFG_TCU_USE_DSP=0 -DVX_CFG_LMEM_LOG_SIZE=14 -DVX_CFG_LMEM_NUM_BANKS=8 -DVX_CFG_XLEN_64=1 -DVX_CFG_TCU_TYPE=TFR -DVX_CFG_FPU_TYPE=STD -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_LMEM_ENABLE -DVX_CFG_TCU_FP16_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_TF32_DISABLE -DVX_CFG_TCU_FP8_DISABLE -DVX_CFG_TCU_FP4_DISABLE -DVX_CFG_TCU_INT8_DISABLE -DVX_CFG_TCU_INT4_DISABLE -DVX_CFG_TCU_MX_DISABLE -DVX_CFG_TCU_MXFP4_DISABLE -DVX_CFG_TCU_NVFP4_DISABLE -DVX_CFG_TCU_DSM_DISABLE -DVX_CFG_EXT_LDST_MATRIX_DISABLE -DOTYPE=fp32 -DKUNROLL=1 -DWGMMA_NRC=8 -DPERF_ENABLE=1 -DITYPE=fp16 -DWGMMA_SS=1 -DVX_CFG_TCU_SPARSE_DISABLE
- id: sparse-fp16-ss
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: p02_wgmma
  args: --case=fp16-sparse-signatures-a --iterations=2
  flags: --profile= --perf=11
  env:
    MAKEFLAGS: -j2
    THREADS: '2'
    CMAKE_BUILD_PARALLEL_LEVEL: '2'
    CCACHE_DISABLE: '1'
    OBJCACHE: ''
    PROFILE: ''
  configs: -DVX_CFG_XLEN=64 -DVX_CFG_NUM_CLUSTERS=1 -DVX_CFG_NUM_CORES=1 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_FETCH_WIDTH=2 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_NUM_TCU_BLOCKS=4 -DVX_CFG_NUM_TCU_LANES=8 -DVX_CFG_TCU_PE_RATIO=1 -DVX_CFG_TCU_LATENCY=4 -DVX_CFG_TCU_USE_DSP=0 -DVX_CFG_LMEM_LOG_SIZE=14 -DVX_CFG_LMEM_NUM_BANKS=8 -DVX_CFG_XLEN_64=1 -DVX_CFG_TCU_TYPE=TFR -DVX_CFG_FPU_TYPE=STD -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_LMEM_ENABLE -DVX_CFG_TCU_FP16_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_TF32_DISABLE -DVX_CFG_TCU_FP8_DISABLE -DVX_CFG_TCU_FP4_DISABLE -DVX_CFG_TCU_INT8_DISABLE -DVX_CFG_TCU_INT4_DISABLE -DVX_CFG_TCU_MX_DISABLE -DVX_CFG_TCU_MXFP4_DISABLE -DVX_CFG_TCU_NVFP4_DISABLE -DVX_CFG_TCU_DSM_DISABLE -DVX_CFG_EXT_LDST_MATRIX_DISABLE -DOTYPE=fp32 -DKUNROLL=1 -DWGMMA_NRC=8 -DPERF_ENABLE=1 -DITYPE=fp16 -DWGMMA_SS=1 -DVX_CFG_TCU_SPARSE_ENABLE -DP02_WGMMA_SPARSE=1
